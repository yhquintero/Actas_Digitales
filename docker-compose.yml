version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEFAULT_LANGUAGE=es
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - APK_DOWNLOAD_PATH=/android/app/release/app-release.apk
      # Orígenes CORS permitidos (coma-separados). Defecto: solo localhost.
      # - ACTAS_CORS_ORIGINS=https://tu-dominio.example,https://www.tu-dominio.example
      # URL canónica de releases mostrada en la Web (defecto: GitHub Releases del repo)
      # - ACTAS_RELEASE_URL=https://github.com/yhquintero/Actas_Digitales/releases
    volumes:
      - ./backend/uploads:/app/uploads
      - ./android:/android:ro
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
