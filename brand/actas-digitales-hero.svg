<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="480" fill="url(#heroBg)" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="120" r="180" fill="#4F46E5" opacity="0.25" filter="blur(60px)" />
  <circle cx="1000" cy="360" r="220" fill="#10B981" opacity="0.18" filter="blur(70px)" />

  <!-- Left Mockup: Web Browser (Actas Digitales Web) -->
  <g transform="translate(80, 50)" filter="url(#cardShadow)">
    <!-- Browser Window Frame -->
    <rect width="600" height="380" rx="16" fill="url(#cardGrad)" />
    <rect width="600" height="42" rx="16" fill="#F1F5F9" />
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="6" fill="#EF4444" />
    <circle cx="42" cy="21" r="6" fill="#F59E0B" />
    <circle cx="60" cy="21" r="6" fill="#10B981" />
    <!-- Address Bar -->
    <rect x="90" y="10" width="340" height="22" rx="6" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="110" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#4F46E5" font-weight="600">🔒 https://actas.negocio.local/app</text>
    <rect x="440" y="12" width="70" height="18" rx="4" fill="#EEF2FF" />
    <text x="448" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#4338CA" font-weight="bold">TLS 1.3 · SEGURO</text>

    <!-- Browser Body Content -->
    <!-- Brand row -->
    <rect x="30" y="60" width="32" height="32" rx="8" fill="#4F46E5" />
    <text x="72" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="bold" fill="#0F172A">Actas Digitales</text>
    <text x="72" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#64748B">Voz a texto oficial consolidado y corregido</text>

    <!-- Step Progress Ribbon -->
    <rect x="30" y="110" width="540" height="32" rx="8" fill="#EEF2FF" stroke="#C7D2FE" />
    <text x="45" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#4338CA">✓ 1. Ingesta  →  ✓ 2. VAD  →  ✓ 3. STT Español  →  ✓ 4. Consolidación  →  ✓ 5. Corrección Ortotipográfica</text>

    <!-- Content Columns -->
    <!-- Col 1: Audio Transcript Original -->
    <rect x="30" y="155" width="255" height="195" rx="10" fill="#FFF1F2" stroke="#FECDD3" />
    <rect x="42" y="168" width="130" height="18" rx="4" fill="#FFE4E6" />
    <text x="48" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#BE123C">AUDIO ORIGINAL (BRUTO)</text>
    <text x="42" y="206" font-family="monospace" font-size="10" fill="#881337">
      <tspan x="42" dy="0">"bueno pues este... damos inicio</tspan>
      <tspan x="42" dy="16">a la sesion del dia de hoy.</tspan>
      <tspan x="42" dy="16">yo-yo creo que vamos a a a</tspan>
      <tspan x="42" dy="16">revisar el presupuesto tecnico.</tspan>
      <tspan x="42" dy="16">¿habra alguna duda?"</tspan>
    </text>

    <!-- Col 2: Final Corrected Official Minutes -->
    <rect x="315" y="155" width="255" height="195" rx="10" fill="#ECFDF5" stroke="#A7F3D0" />
    <rect x="327" y="168" width="140" height="18" rx="4" fill="#D1FAE5" />
    <text x="333" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#047857">ACTA OFICIAL CONSOLIDADA</text>
    <text x="327" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#065F46" font-weight="500">
      <tspan x="327" dy="0">Damos inicio a la sesión del día</tspan>
      <tspan x="327" dy="16">de hoy. Yo creo que vamos a</tspan>
      <tspan x="327" dy="16">revisar el presupuesto técnico.</tspan>
      <tspan x="327" dy="16">¿Habrá alguna duda?</tspan>
      <tspan x="327" dy="24" font-weight="bold" fill="#059669">✓ 3 muletillas suprimidas</tspan>
      <tspan x="327" dy="16" font-weight="bold" fill="#059669">✓ 4 tildes y signos ¿ corregidos</tspan>
    </text>
  </g>

  <!-- Right Mockup: Android Native Smartphone -->
  <g transform="translate(760, 40)" filter="url(#cardShadow)">
    <!-- Phone Bezel -->
    <rect width="210" height="400" rx="32" fill="#020617" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="75" y="14" width="60" height="12" rx="6" fill="#1E293B" />
    <circle x="120" y="20" r="3" fill="#0F172A" />

    <!-- Screen Content -->
    <rect x="10" y="32" width="190" height="356" rx="22" fill="#F8FAFC" />

    <!-- Mobile Top App Bar -->
    <rect x="10" y="32" width="190" height="42" rx="4" fill="#4F46E5" />
    <text x="26" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#FFFFFF">Actas Digitales</text>
    <circle cx="180" cy="53" r="10" fill="#4338CA" />
    <text x="176" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#FFFFFF">🔒</text>

    <!-- Mobile Record Action Card -->
    <rect x="22" y="88" width="166" height="135" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="105" cy="138" r="28" fill="#4F46E5" />
    <!-- Mic icon inside circle -->
    <rect x="99" y="125" width="12" height="18" rx="6" fill="#FFFFFF" />
    <path d="M 94 136 C 94 146, 116 146, 116 136" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="105" y1="146" x2="105" y2="151" stroke="#FFFFFF" stroke-width="2" />
    <text x="56" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#1E293B">Grabar Acta en Vivo</text>
    <text x="46" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#64748B">AAC 16 kHz · Cifrado en tránsito</text>

    <!-- Mobile Progress Card -->
    <rect x="22" y="234" width="166" height="100" rx="14" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="32" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#0F172A">Sincronización HTTPS</text>
    <rect x="32" y="264" width="146" height="6" rx="3" fill="#E2E8F0" />
    <rect x="32" y="264" width="146" height="6" rx="3" fill="#10B981" />
    <text x="32" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#059669" font-weight="bold">✓ 100% Completado y Validado</text>
    <text x="32" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#64748B">Acuerdos listos para compartir</text>
    <rect x="32" y="312" width="146" height="16" rx="4" fill="#4F46E5" />
    <text x="68" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#FFFFFF" font-weight="bold">Copiar / Compartir</text>
  </g>

  <!-- Right Floating Quality / Security Badge -->
  <g transform="translate(1005, 140)" filter="url(#cardShadow)">
    <rect width="165" height="180" rx="16" fill="#1E1B4B" stroke="#4338CA" stroke-width="2" />
    <circle cx="82" cy="45" r="22" fill="#10B981" />
    <text x="73" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" fill="#FFFFFF">🔒</text>
    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="start">HTTPS &amp; TLS 1.3</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#A5B4FC">✓ Certificados firmados</text>
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#A5B4FC">✓ HSTS y cabeceras CSP</text>
    <text x="20" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#A5B4FC">✓ Rate limiting activo</text>
    <text x="20" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" fill="#A5B4FC">✓ Privacidad garantizada</text>
  </g>
</svg>
