<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E1B4B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="18" y="18" width="164" height="164" rx="42" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Border -->
  <rect x="18" y="18" width="164" height="164" rx="42" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Audio Wave Bars Left -->
  <rect x="42" y="90" width="8" height="20" rx="4" fill="#A5B4FC" opacity="0.75" />
  <rect x="56" y="75" width="8" height="50" rx="4" fill="#C7D2FE" opacity="0.9" />

  <!-- Microphone Central Body -->
  <rect x="82" y="52" width="36" height="56" rx="18" fill="#FFFFFF" />
  <rect x="88" y="58" width="24" height="44" rx="12" fill="#E0E7FF" />
  <!-- Mic Grille Lines -->
  <line x1="93" y1="70" x2="107" y2="70" stroke="#6366F1" stroke-width="2" stroke-linecap="round" />
  <line x1="93" y1="78" x2="107" y2="78" stroke="#6366F1" stroke-width="2" stroke-linecap="round" />
  <line x1="93" y1="86" x2="107" y2="86" stroke="#6366F1" stroke-width="2" stroke-linecap="round" />

  <!-- Mic Stand Arc -->
  <path d="M 72 88 C 72 118, 128 118, 128 88" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="100" y1="118" x2="100" y2="136" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <line x1="84" y1="136" x2="116" y2="136" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- Audio Wave Bars Right -->
  <rect x="136" y="75" width="8" height="50" rx="4" fill="#C7D2FE" opacity="0.9" />
  <rect x="150" y="90" width="8" height="20" rx="4" fill="#A5B4FC" opacity="0.75" />

  <!-- Document Check Badge at Lower Right -->
  <circle cx="148" cy="148" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="4" filter="url(#shadow)" />
  <path d="M 140 148 L 146 154 L 157 142" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Golden Quill / Star Accent at Upper Left -->
  <path d="M 44 48 L 50 54 L 44 60 L 38 54 Z" fill="url(#goldGrad)" />
</svg>
