name: CI - Integración Continua

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-security:
    name: Backend, Pipeline y Seguridad HTTPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias del Servidor
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cryptography httpx

      - name: Generar Certificados TLS y Probar Seguridad HTTPS
        run: |
          python tools/generar_certificados_https.py
          python tools/test_seguridad_https.py

      - name: Ejecutar Pruebas del Pipeline de Consolidación
        run: |
          python tools/test_pipeline.py

      - name: Verificar sincronización de versión en todo el proyecto
        run: |
          python tools/check_version_sync.py

      - name: Verificar que web/public/ActasDigitales.apk está sincronizado con el release
        run: |
          python tools/sync_apk.py --check

      - name: Probar almacén de actas (migración JSONL → SQLite, FTS5) y retención
        run: |
          python tools/test_acts_store.py

      - name: Probar diarización y extracción multipista (audio sintético)
        run: |
          python tools/test_audio_inteligente.py

      - name: Ejecutar Suite de Pruebas de Fuego y Vulnerabilidades
        run: |
          python tools/test_pruebas_de_fuego.py

  web-frontend:
    name: Compilación y Tipado Web (React + TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar y Compilar Web
        run: |
          cd web
          npm ci
          npm run build

  apk-distribution-e2e:
    name: E2E Distribución de la App (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar sincronía del APK estático con el release oficial
        run: python tools/sync_apk.py --check

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas del Servidor
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings python-multipart aiofiles requests

      - name: Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Compilar Web
        run: |
          cd web
          npm ci
          npm run build

      - name: Arrancar servidor (sirve Web + API) y esperar salud
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/actas-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Servidor listo tras $i intento(s)"
              exit 0
            fi
            sleep 2
          done
          echo "El servidor no arrancó a tiempo" && cat /tmp/actas-server.log && exit 1

      - name: Instalar navegador Playwright (Chromium)
        run: cd web && npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E (descarga del APK)
        run: cd web && npx playwright test
