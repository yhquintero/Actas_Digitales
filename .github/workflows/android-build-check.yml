name: Android — Build check (sin publicar)

# Compila assembleRelease + bundleRelease en un entorno efímero con una firma
# EFÍMERA generada en el propio runner (se descarta al terminar).
# Propósito: verificar que el código Kotlin/Compose compila, que R8/proguard
# no rompe el build y que los ABI splits generan los artefactos correctos.
# NO publica nada: la distribución firmada con la clave real vive en
# release.yml y requiere los secrets ACTAS_KEYSTORE_* (ver android/README.md).

on:
  push:
    branches: [main, "arena/**"]
    paths: ["android/**", ".github/workflows/android-build-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: assembleRelease + bundleRelease (firma efímera)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generar firma efímera PKCS12 (solo para validar el build)
        run: |
          mkdir -p /tmp/ephemeral
          keytool -genkeypair -v \
            -keystore /tmp/ephemeral/ephemeral.keystore \
            -alias ephemeral -keyalg RSA -keysize 4096 -validity 1 \
            -storetype PKCS12 \
            -storepass ephemeral-only-for-build-check \
            -keypass ephemeral-only-for-build-check \
            -dname "CN=Android Build Check,O=Check,C=CO"

      - name: Compilar APK y AAB (R8 + splits por ABI)
        env:
          ACTAS_KEYSTORE_PATH: /tmp/ephemeral/ephemeral.keystore
          ACTAS_KEYSTORE_PASSWORD: ephemeral-only-for-build-check
          ACTAS_KEY_ALIAS: ephemeral
          ACTAS_KEY_PASSWORD: ephemeral-only-for-build-check
          ACTAS_KEYSTORE_TYPE: pkcs12
          ACTAS_VERSION_NAME: 0.0.0-check
          ACTAS_VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Listar artefactos generados y sus SHA-256
        run: |
          cd android/app/build/outputs
          echo "== APKs ==" && find . -name '*.apk' -type f -exec sha256sum {} \; | sort -k2
          echo "== AABs ==" && find . -name '*.aab' -type f -exec sha256sum {} \; | sort -k2

      - name: Publicar APK/AAB efímeros como artefactos del run (no de la Release)
        uses: actions/upload-artifact@v4
        with:
          name: android-build-check-ephemeral
          path: |
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab
          retention-days: 7
