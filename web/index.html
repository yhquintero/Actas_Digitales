<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Actas Digitales: captura, transcribe, consolida y formaliza la voz de tus reuniones en actas oficiales en español. Servidor propio con HTTPS/TLS 1.3, Web instalable y App Android con APK directo desde la propia web."
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="Actas Digitales" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Actas Digitales" />
    <link rel="icon" type="image/png" sizes="512x512" href="/actas-digitales-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Actas Digitales | Procesamiento de Audio a Texto Corregido</title>
    <script>
      // Desregistrar cualquier Service Worker residual de otras aplicaciones (Inventario / NovaGest)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
            console.log('[Actas Digitales] Service Worker legado eliminado:', registrations[i]);
          }
        });
      }
      // Purgar caches de almacenamiento local para garantizar la carga fresca de Actas Digitales
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
            console.log('[Actas Digitales] Cache Storage purgada:', names[i]);
          }
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
